<!DOCTYPE html>
<html lang="fr">
<head>
    {% load static %}
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-container {
            background-color: #fff;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
        }
        h2 {
            margin-bottom: 20px;
            color: #54BD95;
            font-size: 30px;
            font-family: 'Baloo 2', sans-serif;

        }
        .form-group {
            margin-bottom: 15px;
            margin-top: 30px;
        }
        .form-group label {
            display: block;
            font-size: 16px;
            margin-bottom: 5px;
            font-weight: bold;
        }
        .form-group input {
            width: 360px;
            padding: 10px;
            border: 1px solid #54BD95;
            font-size: 14px;
            border-radius: 4px;
        }
        .form-group input[type="submit"] {
            background-color: #54BD95;
            font-weight: bold;
            padding-top: 4px;
            text-align: center;
            font-size: 20px;
            font-family: 'Baloo 2', sans-serif;
            margin-left: 120px;
            color: white;
            cursor: pointer;
            width: 140px;
            height: 40px;
            border: none;
        }
        .form-group input[type="submit"]:hover {
            background-color: #45a049;
        }
        .logo{
            position: absolute;
            top: 20px;
            width: 10%;
            left: 40px;
        }
        .enter
        {
            font-size: 25px;
            margin-top: 40px;
        }
        @keyframes half-rotation {
            0% {
        transform: rotate(0deg);
    }
    50% {
        transform: rotate(45deg);
    }
    100% {
        transform: rotate(0deg);
    }
}

        .animation
        {
            position: absolute;
            width: 150px;
            height: 150px;
            bottom: 60px;
            right: 100px;
            animation: half-rotation 2s linear infinite;
         }
        .bg
        {
            z-index: -100 !important;
            position: absolute;
            width: 100%;
        }
        .d
        {
            position: absolute;
            bottom: 40px;
            left: 30px;
        }

        .form-group input[type="submit"]:hover {
            background-color: #45a049;
        }
        .form-group input[type="submit"]:active {
            background-color: #3e8e41;
        }
        .form-group input[type="submit"]:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }
        .form-group .error {
            color: red;
            font-size: 12px;
            margin-top: 5px;
        }
        .form-group .success {
            color: green;
            font-size: 12px;
            margin-top: 5px;
        }

    </style>
</head>
<body>
    <img class="bg" src="{% static 'images/bg.png' %}" alt="Share">
    <img class="logo" src="{% static 'images/logoBlack.png' %}" alt="Share">

    <div>
    
        <h2>Hi !</h2>
        <label class="enter">Create a new account .
        </label>

        <form action="" method="POST">
            {% csrf_token %}
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required>
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>
            </div>
            <div class="form-group">
                <label for="password2">Enter your password again</label>
                <input type="password" id="password2" name="password2" required>
            </div>
            <div class="form-group">
                <input type="submit" value="Sign Up">
            </div>
        </form>
    </div>
    <img class="animation" src="{% static 'images/open-enrollment.gif' %}" alt="Share">
    <img class="d" src="{% static 'images/diamonds.png' %}" alt="Share">

    <script src="{% static 'js/signup.js' %}"></script>
</body>
</html>
