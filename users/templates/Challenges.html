<button id="add-test-btn">Add a test </button>

<div id="add-question-form" style="display: none;">
    <h3>Ajouter une Question</h3>
    <label>Type de question :</label>
    <select id="question-type">
        <option value="QCM">QCM</option>
        <option value="QCU">QCU</option>
        <option value="VF">Vrai/Faux</option>
    </select>
    <br>
    <label>Texte de la question :</label>
    <input type="text" id="question-text" required>

    <label>Module :</label>
    <input type="text" id="question-module" required>

    <div id="choices-container">
        <label>Choix de réponse :</label>
        <div class="choice">
            <input type="text" class="choice-text" required>
            <input type="checkbox" class="is-correct"> Correct
        </div>
    </div>

    <button id="add-choice">Ajouter un choix</button>
    <button id="save-question">Enregistrer</button>
</div>

        
    
    </div>
    <script>

        document.getElementById("search-btn").addEventListener("click", function () {
            const searchValue = document.getElementById("search-input").value.trim();
            if (searchValue !== "") {
                module = searchValue; // Met à jour la variable module
                console.log("Module set to:", module);
                // Rafraîchir les questions si nécessaire
            }
        });
        
                // Charger les questions envoyées par Django dans une variable JavaScript
                const questions = JSON.parse(document.getElementById('questions-data').textContent);
                let module = ""
            
                let currentQuestionIndex = 0;
                let lives = 3;
                let currentCategory = "";
            
                document.querySelectorAll(".quiz-btn").forEach(button => {
            button.addEventListener("click", () => {
                currentCategory = button.getAttribute("data-category");
                currentQuestionIndex = 0;
                loadQuestion();
            });
        });
        
                function loadQuestion() {
                    document.getElementById("question-container").style.display = "block";
                    const container = document.getElementById("question-container");
            
                    // Filtrer les questions par catégorie
                    let categoryQuestions = []; 
        if (module !== '') {
            const moduleQuestions = questions.filter(q => q.module.toLowerCase() === module.toLowerCase());
            categoryQuestions = moduleQuestions.filter(q => q.type.toLowerCase() === currentCategory);
        } else {
            categoryQuestions = questions.filter(q => q.type.toLowerCase() === currentCategory);
        }
        
                   
                   
                    if (categoryQuestions.length === 0) {
                        alert("Aucune question disponible pour cette catégorie !");
                        return;
                    }
            
                    const questionData = categoryQuestions[currentQuestionIndex];
                    let htmlContent = '<div id="lives">❤️❤️❤️</div>';
                    htmlContent += `<p>${questionData.question}</p>`;
            
                    if (questionData.type === "QCM") {
                        questionData.choices.forEach(choice => {
                            htmlContent += `<div>
                                <input type="checkbox" name="qcm" value="${choice.text}"> ${choice.text}
                            </div>`;
                        });
                        htmlContent += `<button onclick="checkAnswer()">Valider</button>`;
                    } else if (questionData.type === "QCU") {
                        questionData.choices.forEach(choice => {
                            htmlContent += `<div>
                                <input type="radio" name="qcu" value="${choice.text}"> ${choice.text}
                            </div>`;
                        });
                        htmlContent += `<button onclick="checkAnswer()">Valider</button>`;
                    } else if (questionData.type === "VF") {
                        htmlContent += `<button onclick="checkAnswer(true)">Vrai</button>`;
                        htmlContent += `<button onclick="checkAnswer(false)">Faux</button>`;
                    }
            
                    container.innerHTML = htmlContent;
                }
            
                function checkAnswer(playerAnswer = null) {
            const categoryQuestions = questions.filter(q => q.type.toLowerCase() === currentCategory.toLowerCase());
        
         
            // Vérifier si on a bien une question valide
            if (currentQuestionIndex >= categoryQuestions.length) {
                console.error("❌ Erreur : Index hors limites !");
                return;
            }
        
            const questionData = categoryQuestions[currentQuestionIndex];
        
            console.log("Current Question Data:", questionData);
        
            if (!questionData) {
                console.error("❌ Erreur : Aucune question trouvée !");
                return;
            }
        
            let isCorrect = false;
        
            if (playerAnswer !== null) {
                isCorrect = playerAnswer === (questionData.choices.find(choice => choice.is_correct)?.text);
            } else if (questionData.type === "QCM") {
                const selectedOptions = Array.from(document.querySelectorAll("input[name='qcm']:checked")).map(input => input.value);
                const correctOptions = questionData.choices.filter(choice => choice.is_correct).map(choice => choice.text);
                isCorrect = arraysEqual(selectedOptions, correctOptions);
            } else {
                const selectedOption = document.querySelector("input[name='qcu']:checked");
                isCorrect = selectedOption && selectedOption.value === (questionData.choices.find(choice => choice.is_correct)?.text);
            }
        
            if (isCorrect) {
                alert("Bonne réponse ! 🎉");
            } else {
                lives--;
                updateLives();
                alert("Mauvaise réponse ! ❌");
            }
        
            if (lives > 0) {
                if (currentQuestionIndex < categoryQuestions.length - 1) {
                    currentQuestionIndex++;
                    setTimeout(loadQuestion, 500);
                } else {
                    setTimeout(() => {
                        document.getElementById("question-container").style.display = "none";
                        addCoinsToDatabase();  // Envoyer la mise à jour au serveur
        
                        alert("Félicitations, vous avez terminé cette catégorie !");
                    }, 500);
                }
            } else {
                setTimeout(() => {
                    document.getElementById("question-container").style.display = "none";
                    alert("Game Over !");
                }, 500);
            }
        }
        
        function addCoinsToDatabase() {
            fetch("/add-coins/", {
                method: "POST",
                headers: {
                    "X-CSRFToken": getCSRFToken(),  // Ajoute le token CSRF
                    "Content-Type": "application/json",
                },
                body: JSON.stringify({}),
            })
            .then(response => response.json())
            .then(data => {
                if (data.coins !== undefined) {
                    document.getElementById("coins-display").textContent = `💰 Coins: ${data.coins}`;
                    alert("🎉 +2 coins ajoutés !");
                } else {
                    alert("Erreur lors de l'ajout des coins !");
                }
            })
            .catch(error => console.error("Erreur:", error));
        }
        
        // Fonction pour récupérer le token CSRF
        function getCSRFToken() {
            return document.cookie.split("; ").find(row => row.startsWith("csrftoken="))?.split("=")[1];
        }
        
        
                function arraysEqual(a, b) {
                    if (!Array.isArray(a) || !Array.isArray(b)) return false;
                    if (a.length !== b.length) return false;
                    return [...a].sort().join(',') === [...b].sort().join(',');
                }
            
                function updateLives() {
                    const livesElement = document.getElementById("lives");
                    if (livesElement) {
                        livesElement.innerHTML = '❤️'.repeat(lives);
                    }
                }
        
        
        
                document.getElementById("add-test-btn").addEventListener("click", function () {
            document.getElementById("add-question-form").style.display = "block";
        });
        
        
        
        // Ajouter un nouveau champ de choix
        document.getElementById("add-choice").addEventListener("click", function () {
            const container = document.getElementById("choices-container");
            const div = document.createElement("div");
            div.classList.add("choice");
            div.innerHTML = `
                <input type="text" class="choice-text" required>
                <input type="checkbox" class="is-correct"> Correct
                <button class="remove-choice">❌</button>
            `;
            container.appendChild(div);
        
            // Supprimer un choix
            div.querySelector(".remove-choice").addEventListener("click", function () {
                div.remove();
            });
        });
        
        document.getElementById("save-question").addEventListener("click", function () {
            const questionText = document.getElementById("question-text").value;
            const questionType = document.getElementById("question-type").value;
            const questionModule = document.getElementById("question-module").value;
            const choices = Array.from(document.querySelectorAll(".choice")).map(choice => ({
                text: choice.querySelector(".choice-text").value.trim(), // Vérifie que c'est bien une string
                is_correct: choice.querySelector(".is-correct").checked
            }));
        
            if (!questionText || !questionModule || choices.length === 0 || choices.some(c => c.text === "")) {
                alert("Veuillez remplir tous les champs !");
                return;
            }
        
            const data = {
                question: questionText,
                type: questionType,
                choices: choices,
                module : questionModule 
            };
        
            console.log("Données envoyées :", data); // 🔍 Vérifie dans la console du navigateur
        
            fetch("/add-question/", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "X-CSRFToken": getCSRFToken()
                },
                body: JSON.stringify(data)
            })
            .then(response => response.json())
            .then(result => {
                alert(result.message);
                       // Effacer manuellement les champs
                       document.getElementById("question-text").value = "";
                document.getElementById("question-type").value = "";
                document.getElementById("choices-container").innerHTML = ""; // Supprime les choix
        
        
                document.getElementById("add-question-form").style.display = "none";
            })
            .catch(error => console.error("Erreur:", error));
        });
        
        
        // Fonction pour récupérer le token CSRF
        function getCSRFToken() {
            return document.cookie.split("; ").find(row => row.startsWith("csrftoken"))?.split("=")[1];
        }
            </script>
